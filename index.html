<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NamKyBet - Hè Căng Cực v5.1</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CẤU HÌNH & RESET --- */
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --dark-bg: #050914;
            --card-glass: rgba(10, 20, 40, 0.6);
            --text-color: #ffffff;
            --font-head: 'Coiny', cursive;
            --font-body: 'Quicksand', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-body);
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.15), transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 70px;
        }

        /* --- 2. HIỆU ỨNG BỌT NƯỚC --- */
        #bubble-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bubble {
            position: absolute; bottom: -20px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(0, 243, 255, 0.2));
            border: 1px solid rgba(0, 243, 255, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(255,255,255,0.5);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* --- 3. HEADER & LOGO MỚI (NAMKYBET) --- */
        .header {
            text-align: center; margin-top: 30px; z-index: 10; width: 100%;
            position: relative;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 3.5rem; /* Phóng to lên */
            text-transform: uppercase; letter-spacing: 4px;
            /* Hiệu ứng gradient quét sáng */
            background: linear-gradient(90deg, #fff, var(--neon-cyan), var(--neon-pink), #fff);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 3s linear infinite, neonPulse 2s infinite alternate;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.6));
        }
        
        @keyframes shineText {
            to { background-position: 200% center; }
        }
        
        @keyframes neonPulse {
            from { filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5)); }
            to { filter: drop-shadow(0 0 25px rgba(255, 0, 234, 0.8)); }
        }

        .sub-logo {
            font-family: var(--font-body);
            font-size: 1rem; color: #fff; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 10px rgba(255, 0, 234, 0.4);
        }

        /* --- 4. JACKPOT BOX --- */
        .jackpot-container {
            margin: 25px 0; padding: 15px 40px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-cyan);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(255, 0, 234, 0.2);
            text-align: center; z-index: 10; position: relative;
            backdrop-filter: blur(10px);
        }
        .jackpot-title { 
            font-family: var(--font-body); font-size: 0.85rem; color: var(--neon-pink); 
            text-transform: uppercase; font-weight: 900; letter-spacing: 3px; margin-bottom: 5px; 
            text-shadow: 0 0 10px var(--neon-pink);
        }
        .jackpot-value {
            font-family: var(--font-head); font-size: 2.2rem; color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        /* --- 5. PROMO BANNER --- */
        .promo-box {
            width: 92%; max-width: 600px; margin: 10px auto 30px;
            background: linear-gradient(90deg, #ff00ea, #00f3ff);
            color: #fff; padding: 12px 20px; border-radius: 50px;
            text-align: center; font-size: 1rem; font-weight: 900;
            box-shadow: 0 5px 20px rgba(255, 0, 234, 0.5);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            z-index: 10; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- 6. GAME GRID --- */
        .game-grid {
            display: grid; grid-template-columns: 1fr; gap: 20px;
            width: 90%; max-width: 500px; z-index: 10; padding-bottom: 30px;
        }

        .game-card {
            background: var(--card-glass);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px; padding: 20px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            position: relative; overflow: hidden;
        }
        .game-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg); transition: 0.5s;
        }
        .game-card:hover::before { left: 150%; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--neon-pink); box-shadow: 0 10px 30px rgba(255, 0, 234, 0.3); }
        .game-card:active { transform: scale(0.95); }

        .card-info { display: flex; align-items: center; gap: 20px; }
        .card-icon { font-size: 3.5rem; filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8)); }
        
        .card-text h3 { 
            font-family: var(--font-head); color: #fff; 
            font-size: 1.5rem; margin-bottom: 5px; text-transform: uppercase; 
            letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-cyan);
        }
        .card-text p { color: #aaa; font-size: 0.85rem; font-weight: 700; font-style: italic; }

        .play-btn {
            font-family: var(--font-head);
            background: transparent;
            color: var(--neon-cyan); font-size: 1rem;
            padding: 10px 25px; border-radius: 30px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.2); 
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
            white-space: nowrap;
        }
        .game-card:hover .play-btn { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        .card-tx .play-btn { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.2); }
        .card-tx:hover .play-btn { background: #ff3333; color: #fff; box-shadow: 0 0 20px #ff3333; }
        .card-tx:hover { border-color: #ff3333; box-shadow: 0 10px 30px rgba(255,51,51,0.3); }
        
        .card-sc .play-btn { border-color: #d900ff; color: #d900ff; box-shadow: 0 0 10px rgba(217,0,255,0.2); }
        .card-sc:hover .play-btn { background: #d900ff; color: #fff; box-shadow: 0 0 20px #d900ff; }
        .card-sc:hover { border-color: #d900ff; box-shadow: 0 10px 30px rgba(217,0,255,0.3); }

        /* --- 7. MARQUEE --- */
        .marquee-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background: rgba(5, 9, 20, 0.95); 
            border-top: 1px solid var(--neon-cyan);
            box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.2);
            display: flex; align-items: center; z-index: 100; overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .marquee-content {
            display: inline-block; white-space: nowrap;
            animation: marquee 65s linear infinite;
            color: #fff; font-size: 0.95rem; font-weight: 700;
            padding-left: 100vw;
        }
        .marquee-content span { margin-right: 60px; }
        .marquee-content b { color: var(--neon-pink); font-family: var(--font-head); letter-spacing: 1px; text-shadow: 0 0 5px var(--neon-pink); }
        .marquee-content .money { color: var(--neon-cyan); font-family: var(--font-head); }
        
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- 8. MUSIC BUTTON --- */
        .music-btn {
            position: fixed; bottom: 70px; right: 20px; z-index: 200;
            background: rgba(0, 0, 0, 0.7); color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan); border-radius: 50px;
            padding: 10px 20px; font-size: 0.9rem; font-weight: 900;
            font-family: var(--font-body); text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        .music-btn:active { transform: scale(0.9); }

        /* --- 9. HIỆU ỨNG RIPPLE KHI CLICK MỚI --- */
        .click-ripple {
            position: absolute;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rippleAnim 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 10px var(--neon-pink);
        }
        @keyframes rippleAnim {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 0px; }
        }

        #admin-trigger { position: absolute; top: 0; right: 0; width: 60px; height: 60px; z-index: 999; }
    </style>
</head>
<body>

    <div id="admin-trigger" onclick="openAdmin()"></div>

    <audio id="bgMusic" loop>
        <source src="bg.mp3" type="audio/mpeg">
    </audio>
    <button class="music-btn" id="btnMusic" onclick="toggleMusic()">🔇 BẬT NHẠC HÈ</button>

    <div id="bubble-container"></div>

    <div class="header">
        <div class="logo">NAMKYBET</div>
        <div class="sub-logo">🌊 SUMMER EDITION 🌊</div>
    </div>

    <div class="jackpot-container">
        <div class="jackpot-title">JACKPOT BIỂN ĐÔNG</div>
        <div class="jackpot-value" id="jackpot">36.549.230.500</div>
    </div>

    <div class="promo-box" id="promoText">
        🌴 Hè này nóng quá, nạp tiền vào cho nó mát 🌴
    </div>

    <div class="game-grid">
        <div class="game-card card-tx" onclick="openGame('https://taixiunamkybet.vercel.app/')">
            <div class="card-info">
                <div class="card-icon">🎲</div>
                <div class="card-text">
                    <h3>Tài Xỉu</h3>
                    <p>"Khô máu mùa hè, xa bờ đừng khóc"</p>
                </div>
            </div>
            <button class="play-btn">VÀO BỜ</button>
        </div>

        <div class="game-card card-av" onclick="openGame('https://namkybetaviator.vercel.app/')">
            <div class="card-info">
                <div class="card-icon">✈️</div>
                <div class="card-text">
                    <h3>Aviator</h3>
                    <p>"Máy bay rớt biển, nịt cũng không còn"</p>
                </div>
            </div>
            <button class="play-btn">VÀO BỜ</button>
        </div>

        <div class="game-card card-sc" onclick="openGame('https://namkybet59y2scatter.vercel.app/')">
            <div class="card-info">
                <div class="card-icon">💎</div>
                <div class="card-text">
                    <h3>Scatter</h3>
                    <p>"Tích cực quay tay, vận may sẽ đến"</p>
                </div>
            </div>
            <button class="play-btn">VÀO BỜ</button>
        </div>
    </div>

    <div class="marquee-bar">
        <div class="marquee-content" id="marqueeText"></div>
    </div>

    <script>
        // --- 1. NHẠC NỀN ---
        var music = document.getElementById("bgMusic");
        var btnMusic = document.getElementById("btnMusic");
        var isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                btnMusic.innerHTML = "🔇 BẬT NHẠC HÈ";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    btnMusic.innerHTML = "🔊 TẮT NHẠC";
                    isPlaying = true;
                }).catch(e => alert("Vui lòng chạm màn hình lần nữa để phát nhạc!"));
            }
        }
        document.body.addEventListener('click', function() {
            if(!isPlaying) toggleMusic();
        }, { once: true });

        // --- 2. JACKPOT ---
        let currentJackpot = 36549230500;
        let isGodMode = false;
        
        function updateJackpot() {
            if (!isGodMode) {
                currentJackpot += Math.floor(Math.random() * 500000) + 100000;
                document.getElementById('jackpot').innerText = currentJackpot.toLocaleString('vi-VN');
            }
        }
        setInterval(updateJackpot, 1500);

        // --- 3. GOD MODE ---
        function openAdmin() {
            let pass = prompt("NHẬP MẬT KHẨU ADMIN:");
            if (pass === "1836") {
                isGodMode = true;
                let newJackpot = prompt("CHÀO SẾP! Nhập số tiền Jackpot muốn bịp (VD: 99999999999):");
                if (newJackpot && !isNaN(newJackpot)) {
                    currentJackpot = parseInt(newJackpot);
                    document.getElementById('jackpot').innerText = currentJackpot.toLocaleString('vi-VN');
                    alert("Đã buff Jackpot thành công! Bọn nó nhìn số này chắc lác mắt.");
                } else {
                    isGodMode = false;
                }
            }
        }

        // --- 4. BANNER TROLL MÙA HÈ ---
        const promos = [
            "🌴 Hè này nóng quá, nạp tiền vào cho nó mát 🌴",
            "👙 Khuyến mãi 0% cho anh em đi tắm biển 👙",
            "🔥 Nắng cháy da, tài xỉu cháy túi 🔥",
            "💀 Xin tiền mẹ đi học thêm để gỡ nợ 💀"
        ];
        let pIndex = 0;
        setInterval(() => {
            pIndex = (pIndex + 1) % promos.length;
            document.getElementById('promoText').innerText = promos[pIndex];
        }, 3500);

        // --- 5. MARQUEE MÙA HÈ ---
        const players = [
            "Minh Cùi", "Tí Đỉnh", "Hạt Nhân", "Tiện Nhân", "Thương Nhân", 
            "Phu Nhân", "Mười Răng", "Thanh Quốc", "Trần Gái"
        ];
        const actions = [
            "vừa húp trọn kèo đi du lịch", "vừa thắng lớn để đi bơi", 
            "đang sắm đồ bơi xịn", "vừa chốt quả biệt thự biển", "vừa rước thần tài bờ biển"
        ];
        
        function genMarquee() {
            let html = "";
            for(let i=0; i<30; i++) { 
                let p = players[Math.floor(Math.random() * players.length)];
                let a = actions[Math.floor(Math.random() * actions.length)];
                let m = (Math.floor(Math.random() * 800) + 200) + ".000.000";
                html += `<span>🔔 Chúc mừng <b>${p}</b> ${a} <span class="money">${m} VNĐ</span></span>`;
            }
            document.getElementById('marqueeText').innerHTML = html;
        }
        genMarquee();

        // --- 6. HIỆU ỨNG BỌT NƯỚC ---
        function createBubbles() {
            const container = document.getElementById('bubble-container');
            for (let i = 0; i < 40; i++) {
                let bubble = document.createElement('div');
                bubble.classList.add('bubble');
                let size = Math.random() * 20 + 5; 
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = Math.random() * 5 + 4 + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
                bubble.addEventListener('animationend', function() {
                    this.style.left = Math.random() * 100 + 'vw';
                    this.style.animationDuration = Math.random() * 5 + 4 + 's';
                });
            }
        }
        createBubbles();

        // --- 7. HIỆU ỨNG RIPPLE KHI CLICK ---
        document.addEventListener('click', function(e) {
            let ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            // Tính toán vị trí click
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            
            // Xóa element sau khi animation kết thúc để tránh nặng máy
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        // --- 8. LINK GAME ---
        function openGame(url) {
            if (navigator.vibrate) navigator.vibrate(50);
            document.body.style.opacity = '0';
            document.body.style.transform = 'scale(1.1)';
            document.body.style.transition = 'all 0.5s ease-in-out';
            setTimeout(() => { window.location.href = url; }, 500);
        }
    </script>

</body>
</html>
